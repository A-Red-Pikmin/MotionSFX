name: Build Windows Update Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing draft release tag (example: v0.9.10.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: motionsfx-runtime-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-attach-runtime:
    runs-on: windows-latest
    steps:
      - name: Validate the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+\.\d+$') {
            throw "Use a four-part version tag, such as v0.9.10.3."
          }
          $draft = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) { throw "GitHub could not find release $env:RELEASE_TAG." }
          if ($draft.Trim() -ne "true") { throw "Keep the release as a draft while its Windows runtime is being built." }
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          "MOTIONSFX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building MotionSFX $version"

      - name: Download the source ZIP attached to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $sourceName = "MotionSFX_v{0}.zip" -f $env:MOTIONSFX_VERSION
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $sourceName --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Could not download $sourceName from the draft release." }
          $sourceZip = Join-Path $env:RUNNER_TEMP $sourceName
          if (-not (Test-Path $sourceZip)) { throw "Source ZIP was not downloaded: $sourceZip" }
          $sourceRoot = Join-Path $env:RUNNER_TEMP "MotionSFXSource"
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceRoot -Force

          $matches = @()
          Get-ChildItem -Path $sourceRoot -Filter "MotionSFX.csproj" -File -Recurse | ForEach-Object {
            try {
              [xml]$projectXml = Get-Content $_.FullName -Raw
              $node = $projectXml.SelectSingleNode('/Project/PropertyGroup/Version')
              if ($node -and $node.InnerText.Trim() -eq $env:MOTIONSFX_VERSION) { $matches += $_ }
            } catch { Write-Host "Skipping invalid project: $($_.FullName)" }
          }
          if ($matches.Count -ne 1) { throw "Expected one MotionSFX project with version $env:MOTIONSFX_VERSION; found $($matches.Count)." }

          $projectDir = $matches[0].DirectoryName
          if (-not (Test-Path (Join-Path $projectDir "Updater\MotionSFX.Updater.csproj"))) { throw "Updater project is missing." }
          if (-not (Test-Path (Join-Path $projectDir "Assets\MotionSFX-logo.png"))) { throw "MotionSFX logo is missing." }
          "MOTIONSFX_PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Source validated: $projectDir"

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the self-contained x64 application and updater
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "MotionSFXPublish"
          dotnet publish (Join-Path $env:MOTIONSFX_PROJECT_DIR "MotionSFX.csproj") -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "MotionSFX publish failed." }

          $updaterOutput = Join-Path $env:RUNNER_TEMP "MotionSFXUpdaterPublish"
          dotnet publish (Join-Path $env:MOTIONSFX_PROJECT_DIR "Updater\MotionSFX.Updater.csproj") -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o $updaterOutput
          if ($LASTEXITCODE -ne 0) { throw "MotionSFX updater publish failed." }

          Copy-Item (Join-Path $updaterOutput "MotionSFX.Updater.exe") (Join-Path $publish "MotionSFX.Updater.exe") -Force
          @{ version = $env:MOTIONSFX_VERSION; runtime = "win-x64" } | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $publish "app-version.json") -Encoding utf8

          foreach ($required in @("MotionSFX.exe", "MotionSFX.Updater.exe", "app-version.json", "Assets\MotionSFX-logo.png", "Assets\MotionSFX-icon.ico")) {
            if (-not (Test-Path (Join-Path $publish $required))) { throw "Required runtime file missing: $required" }
          }

          $package = Join-Path $env:RUNNER_TEMP "MotionSFX-win-x64.zip"
          if (Test-Path $package) { Remove-Item $package -Force }
          Compress-Archive -Path (Join-Path $publish "*") -DestinationPath $package -CompressionLevel Optimal

          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            foreach ($required in @("MotionSFX.exe", "MotionSFX.Updater.exe", "app-version.json", "Assets/MotionSFX-logo.png", "Assets/MotionSFX-icon.ico")) {
              if ($entries -notcontains $required) { throw "Runtime package is missing $required." }
            }
          } finally { $archive.Dispose() }

          "MOTIONSFX_RUNTIME_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Runtime package built and validated: $package"

      - name: Attach the Windows runtime ZIP to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "$env:MOTIONSFX_RUNTIME_PACKAGE" --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach MotionSFX-win-x64.zip to the draft release." }
          Write-Host "Runtime package attached. Verify the release Assets section, then publish the release."
